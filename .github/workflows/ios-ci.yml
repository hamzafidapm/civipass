name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve an available iPhone simulator
        id: simulator
        run: |
          DEVICE_NAME=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[] | .[] | select(.name | test("iPhone"))][0].name')
          if [ -z "$DEVICE_NAME" ] || [ "$DEVICE_NAME" = "null" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          echo "Using simulator: $DEVICE_NAME"
          echo "device_name=$DEVICE_NAME" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project CiviPass.xcodeproj \
            -scheme CiviPass \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.device_name }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          set -o pipefail
          # xcodebuild's -collect-test-diagnostics only accepts "on-failure" or "never"
          # (confirmed by a real CI failure) — it cannot express "always", and passing
          # it would override a test plan's own diagnostics policy anyway. Video
          # collection is instead controlled by CiviPass.xctestplan's Diagnostics
          # settings (set to collect on every run, not just failures).
          #
          # -testPlan requires the scheme to actually list the plan as available, which
          # depends on xcodegen having wired project.yml's testPlans: key correctly —
          # unverified from here. -showTestPlans is a read-only query (no tests run),
          # so probing it first can't mask a real test failure: if the plan isn't
          # recognized, we just run without it instead of failing the whole step.
          USE_TEST_PLAN=false
          if xcodebuild -showTestPlans -project CiviPass.xcodeproj -scheme CiviPass 2>&1 \
              | grep -v "associated with" | grep -q "CiviPass"; then
            USE_TEST_PLAN=true
            echo "Scheme reports CiviPass.xctestplan is available; using -testPlan CiviPass so its Diagnostics settings (including always-on video) take effect."
          else
            echo "Scheme does not report CiviPass.xctestplan as an available test plan (xcodegen may not have wired it, or -showTestPlans isn't supported here) — running without -testPlan. No video will be collected this run."
          fi

          TEST_PLAN_FLAG=""
          if [ "$USE_TEST_PLAN" = true ]; then
            TEST_PLAN_FLAG="-testPlan CiviPass"
          fi

          xcodebuild test \
            -project CiviPass.xcodeproj \
            -scheme CiviPass \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.device_name }}" \
            -resultBundlePath TestResults.xcresult \
            $TEST_PLAN_FLAG \
            CODE_SIGNING_ALLOWED=NO

      # Runs even if the Test step failed above — a screenshot from a failing run is
      # still useful, and this step must never be what fails the whole CI job.
      - name: Extract UI test screenshots and video
        if: always()
        run: |
          mkdir -p screenshots
          if [ -d "TestResults.xcresult" ]; then
            xcrun xcresulttool export attachments \
              --path TestResults.xcresult \
              --output-path screenshots \
              || echo "xcresulttool export attachments failed (subcommand may differ on this Xcode version) — screenshots/video may be missing."
          else
            echo "No TestResults.xcresult bundle found; skipping extraction."
          fi
          ls -la screenshots || true
          if find screenshots -iname "*.mov" 2>/dev/null | grep -q .; then
            echo "Found a video recording (.mov) among the extracted attachments."
          else
            echo "No .mov video attachment found — diagnostics video collection may not be enabled on this Xcode/runner. Screenshots (if any) are unaffected."
          fi

      - name: Upload UI test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-screenshots
          path: screenshots
          if-no-files-found: warn
          retention-days: 14

      - name: Upload demo video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-demo-video
          path: screenshots/*.mov
          if-no-files-found: warn
          retention-days: 14
