name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve an available iPhone simulator
        id: simulator
        run: |
          DEVICE_NAME=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[] | .[] | select(.name | test("iPhone"))][0].name')
          if [ -z "$DEVICE_NAME" ] || [ "$DEVICE_NAME" = "null" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          echo "Using simulator: $DEVICE_NAME"
          echo "device_name=$DEVICE_NAME" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project CiviPass.xcodeproj \
            -scheme CiviPass \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.device_name }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project CiviPass.xcodeproj \
            -scheme CiviPass \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.device_name }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      # Runs even if the Test step failed above — a screenshot from a failing run is
      # still useful, and this step must never be what fails the whole CI job.
      - name: Extract UI test screenshots
        if: always()
        run: |
          mkdir -p screenshots
          if [ -d "TestResults.xcresult" ]; then
            xcrun xcresulttool export attachments \
              --path TestResults.xcresult \
              --output-path screenshots \
              || echo "xcresulttool export attachments failed (subcommand may differ on this Xcode version) — screenshots may be missing."
          else
            echo "No TestResults.xcresult bundle found; skipping screenshot extraction."
          fi
          ls -la screenshots || true

      - name: Upload UI test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-screenshots
          path: screenshots
          if-no-files-found: warn
          retention-days: 14
